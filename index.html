<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookLoks - Home</title>
    
    <!-- Complete Master Meta OG Tags -->
    <meta property="og:title" content="BookLoks Learning App">
    <meta property="og:description" content="Gamified learning for Class 4 children. Learn, Play, Earn, and Build your dream home!">
    <meta property="og:image" content="https://yourdomain.com/bookloks-logo.webp">
    <meta property="og:url" content="https://yourdomain.com">
    <meta property="og:type" content="website">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#fff5e6">
    <link rel="icon" href="data/New folder/Bookloks favicon.png" type="image/png">
    
    <style>
        /* --- BASE STYLES --- */
        :root {
            --bg-color: #fff9f0;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #666666;
            --primary-green: #34A853;
            --primary-blue: #4285F4;
            --primary-orange: #FB8C00;
            --accent-yellow: #FFC107;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        /* --- APP CONTAINER --- */
        #app-container {
            display: none; /* Hidden until splash finishes */
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px; /* Space for bottom nav */
            overflow-y: auto;
        }

        /* --- HEADER --- */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .top-header img.logo { height: 40px; }
        .header-icons span { font-size: 24px; margin-left: 15px; color: #d32f2f; cursor: pointer; }

        /* --- PROFILE CARD --- */
        .profile-card {
            background: var(--card-bg);
            margin: 0 20px 15px 20px;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            position: relative;
        }
        .profile-card img.avatar {
            width: 60px; height: 60px;
            border-radius: 50%;
            margin-right: 15px;
            border: 3px solid #ffcc80;
        }
        .profile-info h2 { font-size: 18px; margin-bottom: 2px; }
        .profile-info p { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
        
        .xp-bar-container {
            display: flex; align-items: center; gap: 10px;
        }
        .xp-bar {
            width: 120px; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden;
        }
        .xp-progress { width: 64%; height: 100%; background: #4CAF50; border-radius: 4px; }
        .xp-text { font-size: 11px; font-weight: bold; }

        .level-badge {
            position: absolute; top: 15px; right: 15px;
            background: #2b3a4a; color: white;
            padding: 5px 10px; border-radius: 12px;
            font-size: 12px; font-weight: bold;
        }
        .coins-badge {
            position: absolute; bottom: 15px; right: 15px;
            display: flex; align-items: center; gap: 5px;
            font-size: 16px; font-weight: bold;
        }
        .coins-badge .add-btn {
            background: #4285F4; color: white; border-radius: 50%;
            width: 20px; height: 20px; display: inline-flex;
            justify-content: center; align-items: center; font-size: 14px;
        }

        /* --- HERO ILLUSTRATION --- */
        .hero-section {
            margin: 0 20px 15px 20px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            height: 250px;
            background: #e6cba8 url('path_to_your_3d_boy_image.jpg') center/cover no-repeat; /* Replace with actual image */
        }

        /* --- ACTION BUTTONS --- */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 0 20px 20px 20px;
        }
        .action-btn {
            border-radius: 16px; padding: 15px 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 13px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: none; cursor: pointer; transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn img { height: 35px; margin-bottom: 8px; }
        
        .btn-green { background: linear-gradient(145deg, #4cd964, #34a853); }
        .btn-blue { background: linear-gradient(145deg, #64b5f6, #4285F4); }
        .btn-orange { background: linear-gradient(145deg, #ff9800, #f57c00); }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; border-top: 1px solid #eee;
            display: flex; justify-content: space-around; padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #999; font-size: 11px; font-weight: 600; cursor: pointer;
        }
        .nav-item.active { color: #5e35b1; }
        .nav-item span { font-size: 22px; margin-bottom: 3px; }

    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="data/New folder/Bookloks logo.webp" alt="BookLoks Logo" style="width: 200px;">
        <h2 style="color: var(--text-main); margin-top: 20px;">Loading...</h2>
    </div>

    <!-- Main App Container (Home Screen) -->
    <div id="app-container">
        
        <!-- Top Bar -->
        <div class="top-header">
            <img src="data/New folder/Bookloks logo.webp" alt="BookLoks" class="logo">
            <div class="header-icons">
                <span>🔔</span>
                <span>⚙️</span>
            </div>
        </div>

        <!-- Profile Card -->
        <div class="profile-card">
            <img src="path_to_avatar.png" alt="User" class="avatar"> <!-- Update Image Path -->
            <div class="profile-info">
                <h2>Hi Gaurav!</h2>
                <p>Ready for a new adventure?</p>
                <div class="xp-bar-container">
                    <span class="xp-text">320 / 500 XP</span>
                    <div class="xp-bar"><div class="xp-progress"></div></div>
                </div>
            </div>
            <div class="level-badge">👑 LV 3</div>
            <div class="coins-badge">
                🪙 85 <span class="add-btn">+</span>
            </div>
        </div>

        <!-- Hero Illustration -->
        <div class="hero-section">
            <!-- Add the background image url in the CSS .hero-section class above -->
        </div>

        <!-- Action Buttons -->
        <div class="action-grid">
            <button class="action-btn btn-green" onclick="goToSubjects()">
                <span style="font-size: 24px; margin-bottom: 5px;">🎮</span>
                Continue<br>My Mission →
            </button>
            <button class="action-btn btn-blue">
                <span style="font-size: 24px; margin-bottom: 5px;">🗺️</span>
                Explore<br>Map →
            </button>
            <button class="action-btn btn-orange">
                <span style="font-size: 24px; margin-bottom: 5px;">🎁</span>
                My Rewards<br>→
            </button>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span>🏠</span> Home
            </div>
            <div class="nav-item">
                <span>📖</span> Learn
            </div>
            <div class="nav-item">
                <span>🛖</span> My Home
            </div>
            <div class="nav-item">
                <span>🎒</span> Profile
            </div>
        </div>

    </div>

    <script>
        // Splash Screen Logic
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const app = document.getElementById('app-container');
                
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    app.style.display = 'flex';
                }, 500); // Wait for fade out transition
            }, 2000); // 2 seconds splash duration
        });

        // Navigation function for next step
        function goToSubjects() {
            console.log("Navigating to subjects...");
            // Yahan hum next step ka logic add karenge (Subject Selection hide/show)
            alert("Subject Selection Screen aayegi yahan!");
        }
    </script>
</body>
</html>
